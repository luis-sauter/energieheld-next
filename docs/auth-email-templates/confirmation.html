<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Mail-Adresse bestätigen | DAS Reiseportal</title></head>
<body style="margin:0;background:#faf7f2;color:#1a2731;font-family:Arial,sans-serif">
<main style="max-width:560px;margin:32px auto;padding:32px;background:#ffffff;border-radius:12px">
  <p style="color:#174761;font-weight:bold">DAS Reiseportal</p>
  <h1 style="font-size:24px;color:#174761">Bitte bestätigen Sie Ihre E-Mail-Adresse</h1>
  <p>Bestätigen Sie Ihre E-Mail-Adresse, um Ihr Firmenkonto bei DAS Reiseportal zu aktivieren.</p>
  <p style="margin:28px 0"><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:14px 20px;border-radius:8px;background:#ff8a4c;color:#1a2731;font-weight:bold;text-decoration:none">E-Mail-Adresse bestätigen</a></p>
  <p>Wenn Sie diese Registrierung nicht selbst vorgenommen haben, können Sie diese E-Mail ignorieren.</p>
</main></body></html>
